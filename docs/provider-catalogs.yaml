version: 1
updated: "2026-10-23"
sources:
  r2lab_hardware: https://r2lab.inria.fr/hardware.md
  orchestrator_examples: ../orchestrator/examples
  sophianode_ssh: ../orchestrator/examples/r2lab/output_deployment_model.yaml

# Static inventory only. Dynamic state (leases, reservation owner, power, provisioning)
# is read live from R2Lab by the backend and is never stored here.
# `ssh` reproduces the SSH paths recorded by the orchestrator for these servers.
# `jumphost.user: null` with `user_from: slices_username` means the user's own SLICES username.

slices:
  sophianodes:
    - id: sopnode-f1
      available: true
      r2lab_radio_capable: true
      ssh_hostname: sopnode-f1
      ssh:
        hostname: sopnode-f1
        jumphost: {hostname: duckburg.net.cit.tum.de, port: 10022, user: null, user_from: slices_username}
    - id: sopnode-f2
      available: true
      r2lab_radio_capable: true
      ssh_hostname: sopnode-f2
      ssh:
        hostname: sopnode-f2
        jumphost: {hostname: duckburg.net.cit.tum.de, port: 10022, user: null, user_from: slices_username}
    - id: sopnode-f3
      available: true
      r2lab_radio_capable: true
    - id: sopnode-f4
      available: true
      r2lab_radio_capable: false
      ssh_hostname: 172.28.2.96
      ssh:
        hostname: 172.28.2.96
        jumphost: {hostname: bastion1.theblueprintfactory.org, port: null, user: proxy_for_pos}
    - id: sopnode-w3
      available: true
      r2lab_radio_capable: true
    - id: bm100
      available: true
      r2lab_radio_capable: false
    - id: bm101
      available: true
      r2lab_radio_capable: false
    - id: bm102
      available: true
      r2lab_radio_capable: false
    - id: bm103
      available: true
      r2lab_radio_capable: false
  bi:
    provisioner_type: bi

